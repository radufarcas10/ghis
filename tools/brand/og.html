<!doctype html>
<!-- The link-preview image (site/og.png, 1200 x 630). Rendered by build.sh. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #0d0d0d; color: #f0efec; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; position: relative; }
.glow { position: absolute; border-radius: 50%; filter: blur(90px); }
.g1 { width: 700px; height: 700px; left: -160px; top: -260px; background: radial-gradient(circle, rgba(57,135,229,.45), transparent 65%); }
.g2 { width: 640px; height: 640px; right: -120px; bottom: -300px; background: radial-gradient(circle, rgba(144,133,233,.38), transparent 65%); }
.wrap { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; }
.brand svg { width: 52px; height: 52px; }
h1 { margin: auto 0 0; font-size: 92px; line-height: 0.98; letter-spacing: -0.05em; font-weight: 850; }
h1 em { font-style: normal; background: linear-gradient(100deg, #3987e5, #9085e9 55%, #199e70); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { margin: 26px 0 0; font-size: 30px; color: #c3c2b7; }
.grid { position: absolute; right: 80px; top: 76px; display: grid; grid-template-columns: repeat(14, 22px); gap: 6px; }
.grid i { width: 22px; height: 22px; border-radius: 5px; background: #232321; }
.l1 { background: #104281 !important; } .l2 { background: #1c5cab !important; } .l3 { background: #3987e5 !important; } .l4 { background: #86b6ef !important; }
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="grid" id="grid"></div>
<div class="wrap">
	<div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#f0efec"/><g fill="#0d0d0d"><g fill-opacity="0.45"><rect x="6" y="6" width="5" height="5" rx="1.2"/><rect x="6" y="12" width="5" height="5" rx="1.2"/><rect x="13.5" y="6" width="5" height="5" rx="1.2"/></g><rect x="6" y="18" width="5" height="8" rx="1.5"/><rect x="13.5" y="12" width="5" height="14" rx="1.5"/><rect x="21" y="6" width="5" height="20" rx="1.5"/></g></svg>ghis</div>
	<h1>Your git history,<br><em>told beautifully.</em></h1>
	<p>An animated story of your commits, pull requests and reviews.<br>GitHub · GitLab · Codeberg · any git host</p>
</div>
<script>
	let html = '';
	for (let i = 0; i < 98; i++) {
		const v = (Math.sin(i * 12.9898) * 43758.5453) % 1;
		const level = Math.abs(v) < 0.18 ? 0 : Math.ceil(Math.abs(v) * 4);
		html += `<i class="l${level}"></i>`;
	}
	document.getElementById('grid').innerHTML = html;
</script>
</body></html>
