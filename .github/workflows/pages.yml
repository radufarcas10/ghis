name: pages

# Publishes site/ plus a live demo story (built from sample data) to GitHub Pages.
# Enable it once under Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site and the demo story
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # Canonical URLs, link previews and the sitemap name the main site; a fork (or a
          # custom domain) gets its own published address instead.
          sed -i "s#https://radufarcas10.github.io/ghis/#${BASE_URL%/}/#g" _site/*.html _site/sitemap.xml
          cp src/ghis/web/theme.js src/ghis/web/favicon.svg _site/
          # One live demo per provider vocabulary, each at its own route.
          python ghis.py demo --provider github --out _site/demo
          python ghis.py demo --provider gitlab --out _site/demo/gitlab
          python ghis.py demo --provider gitea --out _site/demo/codeberg
          # Fingerprint every file reference (site.css?v=3f9a1c02), demos and 404 page
          # included: an address changes exactly when its file does, so caches are never stale.
          python tools/version_site.py _site --site-url "${BASE_URL%/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
