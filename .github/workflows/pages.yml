name: pages

# Publishes site/ plus a live demo story (built from sample data) to GitHub Pages.
# Enable it once under Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site and the demo story
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp src/ghis/web/theme.js src/ghis/web/favicon.svg _site/
          # One live demo per provider vocabulary, each at its own route.
          python ghis.py demo --provider github --out _site/demo
          python ghis.py demo --provider gitlab --out _site/demo/gitlab
          python ghis.py demo --provider gitea --out _site/demo/codeberg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
