name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; the oldest and newest on macOS and Windows.
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          # The Python 3.9 macOS ships (/usr/bin/python3, from the Command Line Tools): what a
          # Mac user runs. setup-python has no arm64 3.9, and its x64 one needs Intel Homebrew.
          - { os: macos-latest, python: system }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
    env:
      PYTHON: ${{ matrix.python == 'system' && '/usr/bin/python3' || 'python' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - run: $PYTHON --version
        shell: bash
      # Includes the headless-Chrome tests: GitHub's runners ship Chrome on all three systems.
      - run: $PYTHON -m unittest discover tests -v
        shell: bash

  javascript:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash # globs and loops work the same on Windows (Git Bash)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5 # the phone-layout test builds a demo story with Python
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in src/ghis/web/*.js site/*.js; do node --check "$f"; done
      - run: node --test tests/js/*.test.js

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: The installed command works outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          ghis --version
          ghis demo --out story
          test -s story/index.html && test -s story/lib.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ghis:ci .
      - name: Smoke test
        run: |
          docker run -d --name ghis -p 8080:8080 --read-only --tmpfs /tmp ghis:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q "told beautifully"
          curl -fs "localhost:8080/api/demo?provider=gitlab" | grep -q '"schema"'
